<style>

.slide {

  padding: 4px 12px;

  font-size: 15px;
}
.s-foot .num { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--muc); font-size: 18px; }

.s-kicker {

  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--lam);
  margin: 0 0 6px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.s-kicker::before {

  width: 32px;
  height: 4px;
  border-radius: 2px;

}

.s-title {
  font: 700 40px/1.18 var(--serif);
  color: var(--muc);

.card {

}

}
.tag {

  font-weight: 800;

  padding: 4px 12px;
  border-radius: 99px;
  background: #E8EEF5;
  color: var(--lam);
  margin-bottom: 8px;
}

ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }

  content: "";
  position: absolute;
  left: 2px;
  top: .55em;
  width: 10px;
  height: 10px;

  background: var(--luc);

  color: #991B1B;
  margin-top: 10px;
}

.ans-pill {

  color: #065F46;
  padding: 8px 14px;
  border-radius: 10px;

  margin-top: 8px;
}

table.styled-tbl {

  border-collapse: collapse;
  font-size: 19px;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;

}

  font-weight: 700;
  text-align: left;
}

.slide.cover {
  background: radial-gradient(1100px 650px at 85% 12%, #E3F1EA 0%, transparent 60%), var(--giay);
  padding: 48px 72px;
}
.cover-logos { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
.cover-logos img.hcmus { height: 76px; }
.cover-logos .sep { width: 2px; height: 56px; background: var(--line); }
.cover-logos .sen { width: 72px; height: 72px; background: #fff; border-radius: 20%; padding: 6px; box-shadow: 0 2px 10px rgba(16,33,43,.08); }
.badge-pill {

  font-size: 14px;
  font-weight: 800;

.t-tag {

#ctrl {
  position: fixed;
  left: 50%;

  gap: 6px;
  align-items: center;
  background: rgba(16,33,43,.94);

.panel {

    "html": "\n        <div class=\"s-kicker\">📘 CHUYÊN ĐỀ 1 · MỆNH ĐỀ &amp; TẬP HỢP (25 PHÚT)</div>\n        <h2 class=\"s-title\">1.1. Mệnh Đề Toán Học, Lượng Từ $\\forall, \\exists$ &amp; Mệnh Đề Phủ Định</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:space-between;\">\n            <div>\n              <span class=\"tag\">Lý thuyết cốt lõi</span>\n              <h3>Định nghĩa &amp; Quy tắc Phủ định</h3>\n              <ul class=\"clean\">\n                <li><b>Mệnh đề lôgic:</b> Khẳng định có tính <b>Đúng</b> hoặc <b>Sai</b> xác định. Biểu thức chứa biến $P(x)$ chỉ trở thành mệnh đề khi gán giá trị cụ thể cho $x$ hoặc gắn lượng từ $\\forall, \\exists$.</li>\n                <li><b>Phủ định mệnh đề có lượng từ:</b> Đổi lượng từ ($\\forall \\leftrightarrow \\exists$) đồng thời phủ định tính chất ($P(x) \\leftrightarrow \\overline{P(x)}$):</li>\n              </ul>\n            </div>\n            <div class=\"eq-box\" style=\"margin-top:12px;\">\n              $$\\overline{\\forall x \\in X,\\ P(x)} \\iff \\exists x \\in X,\\ \\overline{P(x)}$$\n              $$\\overline{\\exists x \\in X,\\ P(x)} \\iff \\forall x \\in X,\\ \\overline{P(x)}$$\n            </div>\n            <div class=\"warn-banner\">\n              ⚠️ <b>Bẫy sai lầm:</b> Phủ định của \"$>$\" là \"$\\le$\" (phải có dấu bằng!). Tuyệt đối <b>không</b> đổi $\\in \\mathbb{R}$ thành $\\notin \\mathbb{R}$.\n            </div>\n          </div>\n          <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:space-between; background:#FCFBF8;\">\n            <div>\n              <span class=\"tag\" style=\"background:#FEF3C7; color:#B45309;\">Phân tích câu hỏi đề thi</span>\n              <h3 style=\"color:#B45309;\">Ví dụ mẫu từ 2 File Bài tập</h3>\n              <div class=\"ex-item\">\n                <b>📌 Câu 1 (Đề Lương Thế Vinh):</b> Tìm mệnh đề phủ định của $M$: <i>\"$\\forall x\\in\\mathbb{R},\\ x^2 > 2$\"</i>.<br/>\n                • Đổi $\\forall x\\in\\mathbb{R} \\longrightarrow \\exists x\\in\\mathbb{R}$.<br/>\n                • Phủ định $x^2 > 2 \\longrightarrow x^2 \\le 2$.<br/>\n                $\\implies \\overline{M}$: <b>\"$\\exists x\\in\\mathbb{R},\\ x^2 \\le 2$\"</b> (Chọn <b>A</b>).\n              </div>\n              <div class=\"ex-item\" style=\"margin-top:14px;\">\n                <b>📌 Câu 1 (Bộ 2 – KNTT):</b> Mệnh đề nào <b>đúng</b>?<br/>\n                • A. $\\forall x\\in\\mathbb{R}, x^2 > 0$ $\\rightarrow$ <b>Sai</b> tại phản ví dụ $x=0$.<br/>\n                • B. $\\exists x\\in\\mathbb{N}, x^2 = 3$ $\\rightarrow$ <b>Sai</b> vì $\\sqrt{3} \\notin \\mathbb{N}$.<br/>\n                • C. $\\forall n\\in\\mathbb{N}, n^2+n$ chia hết cho $2$ $\\rightarrow$ <b>ĐÚNG</b> vì $n^2+n = n(n+1)$ là tích 2 số tự nhiên liên tiếp.<br/>\n                • D. $\\exists x\\in\\mathbb{R}, x^2+1=0$ $\\rightarrow$ <b>Sai</b> vì $x^2+1 \\ge 1 > 0$.\n              </div>\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📘 CHUYÊN ĐỀ 1 · MỆNH ĐỀ &amp; TẬP HỢP (25 PHÚT)</div>\n        <h2 class=\"s-title\">1.2. Các Tập Con Của $\\mathbb{R}$ &amp; Bốn Phép Toán Trên Trục Số</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Bảng công thức &amp; Quy tắc biên</span>\n            <h3>Giao ($\\cap$) – Hợp ($\\cup$) – Hiệu ($\\setminus$) – Phần bù ($C_{\\mathbb{R}}$)</h3>\n            <ul class=\"clean\" style=\"font-size:21px;\">\n              <li><b>Giao $A \\cap B$:</b> Lấy phần chung thuộc cả $A$ và $B$.<br/>\n              <small><i>Mẹo:</i> Đầu trái lấy $\\max$, đầu phải lấy $\\min$.</small></li>\n              <li><b>Hợp $A \\cup B$:</b> Gom toàn bộ phần tử của $A$ hoặc $B$.</li>\n              <li><b>Hiệu $A \\setminus B$:</b> Giữ phần thuộc $A$, gạch bỏ phần thuộc $B$.</li>\n              <li><b>Quy tắc \"Đổi Ngoặc\" tại biên khi lấy Hiệu / Phần bù:</b>\n                <ul>\n                  <li>Biên có mặt trong $B$ (ngoặc <code>[</code>, <code>]</code>) $\\rightarrow$ bị trừ mất $\\rightarrow$ thành ngoặc tròn <code>(</code>, <code>)</code>.</li>\n                  <li>Biên không có trong $B$ (ngoặc <code>(</code>, <code>)</code>) $\\rightarrow$ còn nguyên $\\rightarrow$ thành ngoặc vuông <code>[</code>, <code>]</code>.</li>\n                </ul>\n              </li>\n            </ul>\n          </div>\n          <div class=\"card\" style=\"background:#F8FAFC;\">\n            <span class=\"tag\" style=\"background:#E0F2FE; color:#0369A1;\">Minh họa Trục số trực quan</span>\n            <h3 style=\"color:#0369A1;\">Giải mẫu Câu 2 (LTV) &amp; Bài 1 (Bộ 2)</h3>\n            <div class=\"ex-item\">\n              <b>1. Câu 2 (Đề LTV):</b> $P = [-2; 5)$ và $Q = (-1; +\\infty)$<br/>\n              $\\implies P \\cap Q = (-1; 5)$ (Tại $-1$ của $Q$ là ngoặc tròn).\n            </div>\n            <div class=\"ex-item\" style=\"margin-top:10px;\">\n              <b>2. Bài 1 (Bộ 2):</b> $A = [-1; 4)$ và $B = [2; +\\infty)$\n              <svg viewBox=\"0 0 520 95\" style=\"width:100%; height:auto; margin:6px 0; background:#fff; border-radius:8px; border:1px solid #CBD5E0;\">\n                <line x1=\"20\" y1=\"30\" x2=\"490\" y2=\"30\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>\n                <line x1=\"110\" y1=\"30\" x2=\"310\" y2=\"30\" stroke=\"#0F6B55\" stroke-width=\"4\"/>\n                <text x=\"106\" y=\"35\" font-size=\"18\" font-weight=\"bold\" fill=\"#0F6B55\">[</text>\n                <text x=\"306\" y=\"35\" font-size=\"18\" font-weight=\"bold\" fill=\"#0F6B55\">)</text>\n                <text x=\"105\" y=\"18\" font-size=\"14\" font-weight=\"bold\" fill=\"#0F6B55\">-1</text>\n                <text x=\"305\" y=\"18\" font-size=\"14\" font-weight=\"bold\" fill=\"#0F6B55\">4</text>\n                <text x=\"30\" y=\"25\" font-size=\"14\" font-weight=\"bold\" fill=\"#0F6B55\">Tập A</text>\n\n                <line x1=\"20\" y1=\"70\" x2=\"490\" y2=\"70\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>\n                <line x1=\"230\" y1=\"70\" x2=\"480\" y2=\"70\" stroke=\"#1D4ED8\" stroke-width=\"4\"/>\n                <text x=\"226\" y=\"75\" font-size=\"18\" font-weight=\"bold\" fill=\"#1D4ED8\">[</text>\n                <text x=\"225\" y=\"58\" font-size=\"14\" font-weight=\"bold\" fill=\"#1D4ED8\">2</text>\n                <text x=\"465\" y=\"58\" font-size=\"14\" font-weight=\"bold\" fill=\"#1D4ED8\">+∞</text>\n                <text x=\"30\" y=\"65\" font-size=\"14\" font-weight=\"bold\" fill=\"#1D4ED8\">Tập B</text>\n              </svg>\n              • $A \\cap B = [2; 4)$ &nbsp;|&nbsp; $A \\cup B = [-1; +\\infty)$<br/>\n              • $B \\setminus A = [4; +\\infty)$ <i>(vì $4 \\notin A$ nên $4$ vẫn còn trong $B\\setminus A$)</i><br/>\n              • $C_{\\mathbb{R}}A = \\mathbb{R}\\setminus A = (-\\infty; -1) \\cup [4; +\\infty)$.\n            </div>\n          </div>\n        </div>\n     "html": "\n        <div class=\"s-kicker\">📘 CHUYÊN ĐỀ 1 · MỆNH ĐỀ &amp; TẬP HỢP (25 PHÚT)</div>\n        <h2 class=\"s-title\">1.3. Hai Dạng Toán Vận Dụng: Điều Kiện $A \\subset B$ &amp; Biểu Đồ Ven</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Dạng 1 · Bài 2 Tự luận (Bộ 2)</span>\n            <h3>Tìm tham số $m$ để $A \\subset B$</h3>\n            <p style=\"font-size:21px; margin:0 0 10px;\"><b>Quy tắc tổng quát:</b> Với đoạn $[a; b]$ ($a \\le b$):</p>\n            <div class=\"eq-box\" style=\"font-size:22px; padding:12px;\">\n              $$[a; b] \\subset (c; d) \\iff c < a \\le b < d$$\n              $$[a; b] \\subset [c; d] \\iff c \\le a \\le b \\le d$$\n            </div>\n            <div class=\"ex-item\">\n              <b>Giải mẫu Bài 2 (Bộ 2):</b> Tìm $m$ để $[m;\\ m+2] \\subset (-1; 5)$.<br/>\n              • Vì $m < m+2$ luôn thỏa với mọi $m \\in \\mathbb{R}$.<br/>\n              • Để đoạn $[m; m+2]$ nằm hẳn bên trong khoảng mở $(-1; 5)$:<br/>\n              $$\\begin{cases} m > -1 \\\\ m + 2 < 5 \\end{cases} \\iff \\begin{cases} m > -1 \\\\ m < 3 \\end{cases} \\iff \\mathbf{-1 < m < 3}.$$\n              <small style=\"color:#B91C1C;\">⚠️ <b>Kiểm tra biên:</b> Nếu $m = -1$ thì $[-1; 1] \\not\\subset (-1; 5)$ vì $-1 \\notin (-1;5)$ $\\rightarrow$ tuyệt đối không lấy dấu \"$=$\".</small>\n            </div>\n          </div>\n          <div class=\"card\">\n            <span class=\"tag\" style=\"background:#ECFDF5; color:#0F6B55;\">Dạng 2 · Bài 3 Tự luận (Bộ 2)</span>\n            <h3 style=\"color:#0F6B55;\">Công thức Bao hàm – Loại trừ (Sơ đồ Ven)</h3>\n            <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:10px;\">\n              <svg viewBox=\"0 0 220 130\" style=\"width:210px; height:auto; flex:none; background:#fff; border:1px solid #CBD5E0; border-radius:10px;\">\n                <rect x=\"4\" y=\"4\" width=\"212\" height=\"122\" rx=\"6\" fill=\"#F8FAFC\" stroke=\"#64748B\"/>\n                <circle cx=\"85\" cy=\"68\" r=\"42\" fill=\"rgba(15,107,85,0.18)\" stroke=\"#0F6B55\" stroke-width=\"2\"/>\n                <circle cx=\"135\" cy=\"68\" r=\"42\" fill=\"rgba(31,78,121,0.18)\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n                <text x=\"62\" y=\"72\" font-size=\"15\" font-weight=\"bold\" fill=\"#0F6B55\">13</text>\n                <text x=\"106\" y=\"72\" font-size=\"15\" font-weight=\"bold\" fill=\"#B91C1C\">7</text>\n                <text x=\"150\" y=\"72\" font-size=\"15\" font-weight=\"bold\" fill=\"#1F6E79\">11</text>\n                <text x=\"48\" y=\"22\" font-size=\"12\" font-weight=\"bold\" fill=\"#334155\">U = 45 (Ngoài: 14)</text>\n              </svg>\n              <div style=\"font-size:20px;\">\n                $$n(A \\cup B) = n(A) + n(B) - n(A \\cap B)$$\n                $$n(\\text{Không môn nào}) = n(U) - n(A \\cup B)$$\n              </div>\n            </div>\n            <div class=\"ex-item\">\n              <b>Giải mẫu Bài 3 (Bộ 2):</b> Lớp 10B có $45$ HS; $20$ bóng đá ($A$), $18$ cầu lông ($B$), $7$ chơi cả hai môn ($A \\cap B$).<br/>\n              • Số HS chơi ít nhất 1 môn: $n(A \\cup B) = 20 + 18 - 7 = 31$.<br/>\n              • Số HS không chơi môn nào: $45 - 31 = \\mathbf{14}$ (học sinh).\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📐 CHUYÊN ĐỀ 2 · BPT &amp; HỆ BPT BẬC NHẤT HAI ẨN (30 PHÚT)</div>\n        <h2 class=\"s-title\">2.1. Nhận Diện BPT Bậc Nhất Hai Ẩn &amp; Đọc Ngược Miền Nghiệm</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Lý thuyết &amp; Quy tắc 3 bước</span>\n            <h3>1. Dạng chuẩn &amp; Cách xác định miền nghiệm</h3>\n            <ul class=\"clean\" style=\"font-size:20.5px;\">\n              <li><b>Dạng chuẩn:</b> $ax + by \\le c$ (hoặc $\\ge, <, >$) với $a^2+b^2 > 0$. Bậc của $x, y$ phải là <b>bậc 1</b> (Câu 3 LTV: chọn $x - 2y > 0$, loại các câu có $x^2, y^2$).</li>\n              <li><b>Quy tắc biểu diễn miền nghiệm:</b>\n                <ol style=\"margin:4px 0 0; padding-left:22px;\">\n                  <li><b>Vẽ đường bờ $d: ax + by = c$:</b> Có dấu \"$=$\" ($\\le, \\ge$) thì kể cả bờ; dấu строг ($<, >$) thì bỏ bờ.</li>\n                  <li><b>Chọn điểm thử $M_0(x_0; y_0) \\notin d$:</b> Nếu $c \\ne 0$ chọn $O(0;0)$; nếu $c = 0$ (bờ qua $O$) thì chọn $(0;1)$ hoặc $(1;0)$.</li>\n                  <li><b>Kết luận:</b> Thay $M_0$ vào BPT, thỏa mãn thì giữ nửa mặt phẳng chứa $M_0$, gạch bỏ nửa kia.</li>\n                </ol>\n              </li>\n            </ul>\n          </div>\n          <div class=\"card\" style=\"background:#FCFBF8;\">\n            <span class=\"tag\" style=\"background:#FEF3C7; color:#B45309;\">Kỹ năng đọc đồ thị (Câu 4 – Đề LTV)</span>\n            <h3 style=\"color:#B45309;\">2. Đọc ngược hệ BPT từ hình vẽ miền nghiệm</h3>\n            <div style=\"display:grid; grid-template-columns: 220px 1fr; gap:14px; align-items:center;\">\n              <svg width=\"215\" height=\"140\" viewBox=\"0 0 260 155\" style=\"background:#fff; border:1px solid #CBD5E0; border-radius:8px;\">\n                <defs><pattern id=\"hh2\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#b5603f\" stroke-width=\"1\"/></pattern></defs>\n                <rect x=\"0\" y=\"0\" width=\"260\" height=\"155\" fill=\"url(#hh2)\"/>\n                <polygon points=\"-1,58 101,92 257,14 257,-1 -1,-1\" fill=\"#fff\"/>\n                <g stroke=\"#222\" stroke-width=\"1\"><line x1=\"0\" y1=\"80\" x2=\"260\" y2=\"80\"/><line x1=\"125\" y1=\"0\" x2=\"125\" y2=\"155\"/></g>\n                <g stroke=\"#0F6B55\" stroke-width=\"1.8\"><line x1=\"-1\" y1=\"143\" x2=\"257\" y2=\"14\"/><line x1=\"-1\" y1=\"58\" x2=\"257\" y2=\"144\"/></g>\n                <circle cx=\"125\" cy=\"50\" r=\"4\" fill=\"#DC2626\"/>\n                <text x=\"95\" y=\"45\" font-size=\"12\" font-weight=\"bold\" fill=\"#DC2626\">M(0;1)</text>\n                <text x=\"155\" y=\"14\" font-size=\"11\" font-weight=\"bold\" fill=\"#0F6B55\">x−2y=0</text>\n                <text x=\"6\" y=\"34\" font-size=\"11\" font-weight=\"bold\" fill=\"#0F6B55\">x+3y+2=0</text>\n              </svg>\n              <div style=\"font-size:19px; line-height:1.45;\">\n                • Đề bài ghi <b>\"kể cả bờ\"</b> $\\rightarrow$ loại D (dấu $<, >$).<br/>\n                • Vì bờ $x - 2y = 0$ đi qua $O(0;0)$, ta chọn điểm <b>$M(0; 1)$</b> trên trục $Oy$ nằm trọn trong miền trắng:<br/>\n                1) Thay vào $x - 2y$: $0 - 2(1) = -2 \\le 0 \\Rightarrow \\mathbf{x - 2y \\le 0}$.<br/>\n                2) Thay vào $x + 3y$: $0 + 3(1) = 3 \\ge -2 \\Rightarrow \\mathbf{x + 3y \\ge -2}$.<br/>\n                $\\implies$ Chọn đáp án <b>C</b>!\n              </div>\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📐 CHUYÊN ĐỀ 2 · BPT &amp; HỆ BPT BẬC NHẤT HAI ẨN (30 PHÚT)</div>\n        <h2 class=\"s-title\">2.2. Định Lý Cực Trị Đa Giác Lồi &amp; Toán Thực Tế Kinh Tế</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Thuật toán 4 bước · Bài 4 Tự luận (Bộ 2)</span>\n            <h3>Tìm $\\max / \\min$ của $F(x,y) = mx + ny$</h3>\n            <p style=\"font-size:19.5px; margin:0 0 8px;\"><b>Định lý:</b> Biểu thức bậc nhất $F(x,y) = mx + ny$ trên miền đa giác nghiệm $\\Omega$ luôn đạt GTLN và GTNN tại một trong các <b>đỉnh của đa giác $\\Omega$</b>.</p>\n            <div class=\"ex-item\" style=\"font-size:19px;\">\n              <b>Minh họa Bài 4 (Bộ 2):</b> Tìm $\\max F = 3x + 2y$ với:<br/>\n              $$\\begin{cases} x \\ge 0,\\ y \\ge 0 \\\\ x + 2y \\le 8 \\quad (d_1) \\\\ 2x + y \\le 10 \\quad (d_2) \\end{cases}$$\n              • <b>Tọa độ 4 đỉnh miền tứ giác $OABC$:</b><br/>\n              $O(0;0)$;\\quad $A(5;0) = d_2\\cap Ox$;\\quad $C(0;4) = d_1\\cap Oy$;<br/>\n              Đỉnh $B = d_1 \\cap d_2$: giải hệ $\\begin{cases}x+2y=8\\\\2x+y=10\\end{cases} \\Rightarrow \\mathbf{B(4; 2)}$.<br/>\n              • <b>Tính $F$ tại 4 đỉnh:</b> $F(0;0)=0$;\\ $F(5;0)=15$;\\ $F(0;4)=8$;\\ $F(4;2) = 3(4)+2(2) = \\mathbf{16}$. Vậy $\\max F = 16$ tại $(4;2)$.\n            </div>\n          </div>\n          <div class=\"card\" style=\"background:#F0FDF4; border-color:#A7F3D0;\">\n            <span class=\"tag\" style=\"background:#0F6B55; color:#fff;\">Mô hình hóa thực tế · Bài 5 Tự luận (Bộ 2)</span>\n            <h3 style=\"color:#0F6B55;\">Bài toán tối ưu sản xuất Bàn &amp; Ghế</h3>\n            <div style=\"font-size:19.5px; line-height:1.48;\">\n              <p style=\"margin:0 0 8px;\"><b>Tóm tắt đề:</b> Bàn: $3$ giờ/cái, lãi $300$k. Ghế: $1$ giờ/cái, lãi $200$k. Tối đa $24$ giờ/ngày và tổng số không quá $12$ sản phẩm.</p>\n              <p style=\"margin:0 0 6px;\"><b>Bước 1 (Lập mô hình):</b> Gọi $x, y$ là số bàn, số ghế ($x,y \\ge 0$):</p>\n              <div class=\"eq-box\" style=\"font-size:20px; padding:8px; margin-bottom:8px;\">\n                $$\\begin{cases} 3x + y \\le 24 \\quad (\\text{giờ công}) \\\\ x + y \\le 12 \\quad (\\text{tổng SP}) \\\\ x \\ge 0,\\ y \\ge 0 \\end{cases} \\longrightarrow \\max F = 300x + 200y$$\n              </div>\n              <p style=\"margin:0 0 6px;\"><b>Bước 2 (Tìm 4 đỉnh của miền nghiệm):</b><br/>\n              • $O(0;0) \\Rightarrow F = 0$<br/>\n              • $A(8;0) \\Rightarrow F = 300(8) = 2400$ (nghìn đồng)<br/>\n              • $C(0;12) \\Rightarrow F = 200(12) = 2400$ (nghìn đồng)<br/>\n              • Giao điểm $B(6;6)$ của $\\begin{cases}3x+y=24\\\\x+y=12\\end{cases} \\Rightarrow F(6;6) = \\mathbf{3000}$.</p>\n              <div class=\"ans-pill\">✔ Kết luận: Làm <b>6 bàn và 6 ghế</b> mỗi ngày để lãi lớn nhất <b>3 triệu đồng</b>.</div>\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📈 CHUYÊN ĐỀ 3 · HÀM SỐ &amp; ĐỒ THỊ HÀM SỐ BẬC HAI (35 PHÚT)</div>\n        <h2 class=\"s-title\">3.1. Tập Xác Định $D$ &amp; Bẫy Hàm Số Cho Bởi Nhiều Công Thức</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Quy tắc tìm Tập xác định</span>\n            <h3>1. Ba điều kiện xác định cơ bản</h3>\n            <ul class=\"clean\" style=\"font-size:21px;\">\n              <li><b>Có mẫu số $\\dfrac{A}{B}$:</b> Điều kiện $B \\ne 0$.</li>\n              <li><b>Có căn bậc hai $\\sqrt{A}$:</b> Điều kiện $A \\ge 0$.</li>\n              <li><b>Căn bậc hai dưới mẫu $\\dfrac{1}{\\sqrt{A}}$:</b> Điều kiện $A > 0$.</li>\n            </ul>\n            <div class=\"ex-item\" style=\"margin-top:14px; font-size:19.5px;\">\n              <b>Giải nhanh các câu trong 2 File:</b><br/>\n              • <b>Câu 5 (Đề LTV):</b> $y = \\sqrt{2-x}$: ĐK $2-x \\ge 0 \\iff x \\le 2 \\Rightarrow D = (-\\infty; 2]$ (Chọn <b>C</b>).<br/>\n              • <b>Câu 4 (Bộ 2):</b> $y = \\dfrac{x+1}{x^2-4}$: ĐK $x^2-4 \\ne 0 \\Rightarrow D = \\mathbb{R}\\setminus\\{-2; 2\\}$.<br/>\n              • <b>Bài 6a (Bộ 2):</b> $y = \\sqrt{x+3} + \\dfrac{1}{x-1} \\Rightarrow D = [-3; +\\infty)\\setminus\\{1\\}$.\n            </div>\n          </div>\n          <div class=\"card\" style=\"background:#FFFBEB; border-color:#FDE68A;\">\n            <span class=\"tag\" style=\"background:#D97706; color:#fff;\">Phân tích Đúng/Sai · Phần II Câu 1 (Đề LTV)</span>\n            <h3 style=\"color:#B45309;\">2. Hàm số cho bởi nhiều công thức</h3>\n            <div class=\"eq-box\" style=\"font-size:22px; padding:10px; margin-bottom:10px;\">\n              $$f(x) = \\begin{cases} -2x + 1 & \\text{khi } x \\ge 2 \\quad \\text{(Nhánh 1)} \\\\ \\dfrac{1}{x - 2} & \\text{khi } x < 2 \\quad \\text{(Nhánh 2)} \\end{cases}$$\n            </div>\n            <ul class=\"clean\" style=\"font-size:19.5px; gap:8px;\">\n              <li><b>Ý a) TXĐ là $D = \\mathbb{R}$:</b> <b>ĐÚNG!</b> Vì khi $x < 2$ thì hiển nhiên $x - 2 \\ne 0$, nên Nhánh 2 xác định trên toàn bộ $(-\\infty; 2)$. Hợp với $[2; +\\infty)$ ta được $D = \\mathbb{R}$.</li>\n              <li><b>Ý b) $f(2) = -3$:</b> <b>ĐÚNG!</b> Vì $x=2 \\ge 2$ nên thay vào Nhánh 1: $f(2) = -2(2)+1 = -3$.</li>\n              <li><b>Ý c) $f(0) = 1$:</b> <b>SAI!</b> Vì $x=0 < 2$ nên phải thay vào Nhánh 2: $f(0) = \\dfrac{1}{0-2} = -\\dfrac{1}{2} \\ne 1$.</li>\n              <li><b>Ý d) Nghịch biến trên $(2; +\\infty)$:</b> <b>ĐÚNG!</b> Vì trên $(2;+\\infty)$, $f(x) = -2x+1$ là hàm bậc nhất có hệ số góc $a = -2 < 0$.</li>\n            </ul>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📈 CHUYÊN ĐỀ 3 · HÀM SỐ &amp; ĐỒ THỊ HÀM SỐ BẬC HAI (35 PHÚT)</div>\n        <h2 class=\"s-title\">3.2. Đỉnh, Trục Đối Xứng, Chiều Biến Thiên &amp; Cực Trị Parabol</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Lý thuyết Parabol $y = ax^2 + bx + c\\ (a\\ne 0)$</span>\n            <h3>1. Bốn yếu tố giải tích cốt lõi</h3>\n            <div class=\"eq-box\" style=\"font-size:22px; padding:10px; margin-bottom:10px;\">\n              $$\\text{Đỉnh } S\\left(-\\dfrac{b}{2a};\\ -\\dfrac{\\Delta}{4a}\\right) \\quad \\Big|\\quad \\text{Trục ĐX: } x = -\\dfrac{b}{2a}$$\n            </div>\n            <table class=\"styled-tbl\" style=\"font-size:18.5px;\">\n              <thead>\n                <tr><th>Hệ số $a$</th><th>Chiều biến thiên</th><th>GTLN / GTNN</th></tr>\n              </thead>\n              <tbody>\n                <tr>\n                  <td><b>$a > 0$</b><br/>(Lõm lên $\\cup$)</td>\n                  <td>• NB $\\searrow$ trên $(-\\infty; x_S)$<br/>• ĐB $\\nearrow$ trên $(x_S; +\\infty)$</td>\n                  <td>$\\min_{\\mathbb{R}} y = y_S$<br/>tại $x = x_S$</td>\n                </tr>\n                <tr>\n                  <td><b>$a < 0$</b><br/>(Lõm xuống $\\cap$)</td>\n                  <td>• ĐB $\\nearrow$ trên $(-\\infty; x_S)$<br/>• NB $\\searrow$ trên $(x_S; +\\infty)$</td>\n                  <td>$\\max_{\\mathbb{R}} y = y_S$<br/>tại $x = x_S$</td>\n                </tr>\n              </tbody>\n            </table>\n          </div>\n          <div class=\"card\" style=\"background:#FCFBF8;\">\n            <span class=\"tag\" style=\"background:#FEF2F2; color:#B91C1C;\">Cẩn trọng các bẫy Đúng/Sai (Phần II C2 LTV &amp; C13 Bộ 2)</span>\n            <h3 style=\"color:#B91C1C;\">2. Phân tích Parabol $(P): y = -2x^2 + x - 1$</h3>\n            <ul class=\"clean\" style=\"font-size:19.5px; gap:10px;\">\n              <li><b>Hoành độ đỉnh:</b> $x_S = -\\dfrac{b}{2a} = -\\dfrac{1}{2\\cdot(-2)} = \\mathbf{\\dfrac{1}{4}}$.<br/>\n              Tung độ đỉnh: $y_S = -2\\left(\\dfrac{1}{4}\\right)^2 + \\dfrac{1}{4} - 1 = \\mathbf{-\\dfrac{7}{8}} \\Rightarrow$ <b>Ý a) ĐÚNG</b>.</li>\n              <li><b>Trục đối xứng:</b> Phải là $x = \\dfrac{1}{4}$ (Đề ghi $x = \\dfrac{1}{2}$ do quên nhân $2$ ở mẫu $\\rightarrow$ <b>Ý b) SAI</b>).</li>\n              <li><b>Cực trị:</b> Vì $a = -2 < 0$ nên hàm số đạt <b>GTLN</b> bằng $y_S = -\\dfrac{7}{8}$ $\\rightarrow$ <b>Ý c) ĐÚNG</b>.</li>\n              <li><b>Ý d) Parabol $(P')$ có đỉnh trùng với $S\\left(\\tfrac{1}{4}; -\\tfrac{7}{8}\\right)$:</b><br/>\n              Nếu $(P'): y = -2x^2 + x + 3$ thì $y_{\\text{đỉnh}} = -\\tfrac{1}{8} + \\tfrac{1}{4} + 3 = \\tfrac{25}{8} \\ne -\\tfrac{7}{8}$ (Tịnh tiến lên $4$ đơn vị làm đổi đỉnh!) $\\rightarrow$ <b>Ý d) SAI</b>.</li>\n            </ul>\n          </div>\n        </div>\n        "

        <div style=\"display:grid; grid-template-columns: 205px 1fr; gap:12px; align-items:center;\">\n              <svg width=\"200\" height=\"150\" viewBox=\"0 0 300 190\" style=\"background:#fff; border:1px solid #CBD5E0; border-radius:8px;\">\n                <line x1=\"15\" y1=\"150\" x2=\"285\" y2=\"150\" stroke=\"#1E293B\" stroke-width=\"1.8\"/>\n                <line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"175\" stroke=\"#1E293B\" stroke-width=\"1.8\"/>\n                <path d=\"M 46 150 Q 150 -90 254 150\" fill=\"none\" stroke=\"#B85042\" stroke-width=\"2.8\"/>\n                <rect x=\"90\" y=\"70\" width=\"120\" height=\"80\" fill=\"rgba(217,119,6,0.12)\" stroke=\"#D97706\" stroke-width=\"2\"/>\n                <circle cx=\"150\" cy=\"30\" r=\"4.5\" fill=\"#0F6B55\"/>\n                <circle cx=\"210\" cy=\"70\" r=\"4.5\" fill=\"#DC2626\"/>\n                <text x=\"156\" y=\"26\" font-size=\"13\" font-weight=\"bold\" fill=\"#0F6B55\">G(0;3)</text>\n                <text x=\"216\" y=\"68\" font-size=\"13\" font-weight=\"bold\" fill=\"#DC2626\">E(1,5; 2)</text>\n                <text x=\"34\" y=\"168\" font-size=\"14\" font-weight=\"bold\" fill=\"#1E293B\">A</text>\n                <text x=\"252\" y=\"168\" font-size=\"14\" font-weight=\"bold\" fill=\"#1E293B\">B</text>\n                <text x=\"136\" y=\"166\" font-size=\"13\" font-weight=\"bold\" fill=\"#1E293B\">O</text>\n              </svg>\n              <div style=\"font-size:18.5px; line-height:1.45;\">\n                • <b>Bước 1 (Chọn trục):</b> Gốc $O(0;0)$ tại trung điểm $AB$, $Oy$ qua đỉnh cổng $G(0;3)$. Phương trình cổng:<br/>\n                $$(P): y = ax^2 + 3$$\n                • <b>Bước 2 (Tìm $a$):</b> Cửa rộng $3\\text{m}$, cao $2\\text{m} \\Rightarrow$ mép trên cửa $E\\left(\\dfrac{3}{2}; 2\\right) \\in (P)$:<br/>\n                $$2 = a\\left(\\dfrac{3}{2}\\right)^2 + 3 \\Rightarrow a = -\\dfrac{4}{9}$$\n              </div>\n            </div>\n            <div class=\"ex-item\" style=\"margin-top:10px; font-size:19px;\">\n              • <b>Bước 3 (Tìm $AB$):</b> Chân cổng ứng với $y = 0 \\iff -\\dfrac{4}{9}x^2 + 3 = 0 \\iff x = \\pm\\dfrac{3\\sqrt{3}}{2}$.<br/>\n              $\\implies$ Độ dài $AB = 2 \\cdot \\dfrac{3\\sqrt{3}}{2} = 3\\sqrt{3} \\approx \\mathbf{5{,}2\\text{ m}}$. <i>(Bài 9 Bộ 2: $h(t)=-5t^2+20t+1$ đạt $\\max = 21\\text{m}$ tại $t=2\\text{s}$).</i>\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📐 CHUYÊN ĐỀ 4 · HỆ THỨC LƯỢNG TRONG TAM GIÁC (30 PHÚT)</div>\n        <h2 class=\"s-title\">4.1. Giá Trị Lượng Giác Góc $0^\\circ \\to 180^\\circ$: Phụ Chéo – Sin Bù</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Lý thuyết nửa đường tròn đơn vị</span>\n            <h3>1. Dấu lượng giác &amp; Quan hệ Phụ – Bù</h3>\n            <ul class=\"clean\" style=\"font-size:20px;\">\n              <li><b>Quy tắc dấu quan trọng nhất:</b>\n                <ul>\n                  <li>Với mọi $\\alpha \\in (0^\\circ; 180^\\circ)$: luôn có $\\mathbf{\\sin\\alpha > 0}$.</li>\n                  <li>Nếu $\\alpha$ là <b>góc tù ($90^\\circ < \\alpha < 180^\\circ$)</b>: $\\mathbf{\\cos\\alpha < 0,\\ \\tan\\alpha < 0,\\ \\cot\\alpha < 0}$.</li>\n                </ul>\n              </li>\n              <li><b>Hai góc phụ nhau ($\\alpha$ và $90^\\circ - \\alpha$):</b> <i>\"Phụ chéo\"</i>\n                $$\\sin(90^\\circ-\\alpha) = \\cos\\alpha;\\quad \\cos(90^\\circ-\\alpha) = \\sin\\alpha$$\n                <small>(<b>Câu 8 Đề LTV:</b> Chọn D: $\\cos(90^\\circ-\\alpha) = \\sin\\alpha$).</small>\n              </li>\n              <li><b>Hai góc bù nhau ($\\alpha$ và $180^\\circ - \\alpha$):</b> <i>\"Sin bù, còn lại đối\"</i>\n                $$\\sin(180^\\circ-\\alpha) = \\sin\\alpha;\\quad \\cos(180^\\circ-\\alpha) = -\\cos\\alpha$$\n                <small>(<b>Câu 6 Bộ 2:</b> $\\sin 150^\\circ = \\sin(180^\\circ-30^\\circ) = \\sin 30^\\circ = \\dfrac{1}{2}$).</small>\n              </li>\n            </ul>\n          </div>\n          <div class=\"card\" style=\"background:#FCFBF8;\">\n            <span class=\"tag\" style=\"background:#FEF3C7; color:#B45309;\">Phương pháp giải Bài 10 Tự luận (Bộ 2)</span>\n            <h3 style=\"color:#B45309;\">2. Hệ thức cơ bản &amp; Bẫy dấu góc tù</h3>\n            <div class=\"eq-box\" style=\"font-size:22px; padding:10px;\">\n              $$\\sin^2\\alpha + \\cos^2\\alpha = 1; \\qquad \\tan\\alpha = \\dfrac{\\sin\\alpha}{\\cos\\alpha}$$\n            </div>\n            <div class=\"ex-item\" style=\"font-size:19.5px;\">\n              <b>📌 Bài 10a (Bộ 2):</b> Tính $P = \\sin 30^\\circ\\cos 60^\\circ + \\sin 60^\\circ\\cos 30^\\circ + \\tan 45^\\circ$<br/>\n              $$P = \\dfrac{1}{2}\\cdot\\dfrac{1}{2} + \\dfrac{\\sqrt{3}}{2}\\cdot\\dfrac{\\sqrt{3}}{2} + 1 = \\dfrac{1}{4} + \\dfrac{3}{4} + 1 = \\mathbf{2}.$$\n            </div>\n            <div class=\"ex-item\" style=\"font-size:19.5px; margin-top:12px;\">\n              <b>📌 Bài 10b (Bộ 2):</b> Cho $\\sin\\alpha = \\dfrac{3}{5}$ với $90^\\circ < \\alpha < 180^\\circ$. Tính $\\cos\\alpha, \\tan\\alpha$.<br/>\n              • Vì $90^\\circ < \\alpha < 180^\\circ$ (góc tù) nên $\\mathbf{\\cos\\alpha < 0}$:<br/>\n              $$\\cos\\alpha = -\\sqrt{1 - \\sin^2\\alpha} = -\\sqrt{1 - \\dfrac{9}{25}} = \\mathbf{-\\dfrac{4}{5}} \\implies \\tan\\alpha = \\dfrac{\\sin\\alpha}{\\cos\\alpha} = \\mathbf{-\\dfrac{3}{4}}.$$\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📐 CHUYÊN ĐỀ 4 · HỆ THỨC LƯỢNG TRONG TAM GIÁC (30 PHÚT)</div>\n        <h2 class=\"s-title\">4.2. Định Lý Côsin, Định Lý Sin &amp; Bài Toán Đo Đạc Thực Tế</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Hệ thống công thức giải tam giác</span>\n            <h3>1. Khi nào dùng Côsin? Khi nào dùng Sin?</h3>\n            <ul class=\"clean\" style=\"font-size:19.5px; gap:8px;\">\n              <li><b>Định lý Côsin</b> (Biết 2 cạnh + góc xen giữa, hoặc biết 3 cạnh):\n                $$a^2 = b^2 + c^2 - 2bc\\cos A \\implies \\cos A = \\dfrac{b^2+c^2-a^2}{2bc}$$</li>\n              <li><b>Định lý Sin</b> (Biết 1 cặp cạnh – góc đối diện, hoặc 1 cạnh + 2 góc):\n                $$\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C} = 2R \\implies R = \\dfrac{a}{2\\sin A}$$\n                <small>(<b>Câu 9 Đề LTV:</b> $BC=10, \\widehat{A}=30^\\circ \\Rightarrow R = \\dfrac{10}{2\\sin 30^\\circ} = 10$).</small>\n              </li>\n              <li><b>5 Công thức Diện tích $S$ &amp; Đường cao $h_a$:</b>\n                $$S = \\dfrac{1}{2}bc\\sin A = \\dfrac{1}{2}a h_a = \\dfrac{abc}{4R} = pr = \\sqrt{p(p-a)(p-b)(p-c)}$$\n                $$\\implies h_a = \\dfrac{2S}{a}$$</li>\n            </ul>\n          </div>\n          <div class=\"card\" style=\"background:#F0FDF4; border-color:#A7F3D0;\">\n            <span class=\"tag\" style=\"background:#0F6B55; color:#fff;\">Giải mẫu Bài 11, 12, 13 Tự luận (Bộ 2)</span>\n            <h3 style=\"color:#0F6B55;\">2. Ứng dụng giải tam giác &amp; Đo chiều rộng sông</h3>\n            <div class=\"ex-item\" style=\"font-size:19px;\">\n              <b>📌 Bài 11 (Bộ 2):</b> Cho $AB=c=3,\\ AC=b=8,\\ \\widehat{A}=60^\\circ$.<br/>\n              • Định lý Côsin: $BC^2 = 3^2 + 8^2 - 2\\cdot 3\\cdot 8\\cos 60^\\circ = 49 \\implies \\mathbf{BC = 7}$.<br/>\n              • Diện tích: $S = \\dfrac{1}{2}\\cdot 3\\cdot 8\\sin 60^\\circ = \\mathbf{6\\sqrt{3}}$.<br/>\n              • Đường cao: $h_a = \\dfrac{2S}{BC} = \\mathbf{\\dfrac{12\\sqrt{3}}{7}}$; \\quad Ngoại tiếp: $R = \\dfrac{7}{2\\sin 60^\\circ} = \\mathbf{\\dfrac{7\\sqrt{3}}{3}}$.\n            </div>\n            <div class=\"ex-item\" style=\"font-size:19px; margin-top:10px;\">\n              <b>📌 Bài 13 (Bộ 2 – Đo khoảng cách qua sông):</b> Biết $AB = 100\\text{ m}$, $\\widehat{CAB} = 60^\\circ$, $\\widehat{CBA} = 75^\\circ$. Tính $AC$.<br/>\n              • Tính góc đối diện cạnh $AB$: $\\widehat{C} = 180^\\circ - (60^\\circ + 75^\\circ) = 45^\\circ$.<br/>\n              • Định lý Sin: $\\dfrac{AC}{\\sin B} = \\dfrac{AB}{\\sin C} \\implies AC = \\dfrac{100\\cdot\\sin 75^\\circ}{\\sin 45^\\circ} = 50(\\sqrt{3}+1) \\approx \\mathbf{136{,}6\\text{ m}}$.\n            </div>\n          </div>\n        </div>\n        "

c{4/5}{2/3} = \\dfrac{6}{5}$ và $\\dfrac{1/5}{1/6} = \\dfrac{6}{5} \\implies \\mathbf{\\overrightarrow{AH} = \\dfrac{6}{5}\\overrightarrow{AI}} \\implies A,I,H$ thẳng hàng!\n            </div>\n          </div>\n          <div class=\"card\">\n            <span class=\"tag\">Tự luận vận dụng · Bài 15 (Bộ 2)</span>\n            <h3>2. Giải chi tiết Bài 15 (Bộ 2)</h3>\n            <p style=\"font-size:19px; margin:0 0 8px;\"><b>Đề bài:</b> Cho $\\triangle ABC$, $I$ là trung điểm $AB$ và điểm $M$ thỏa mãn $\\overrightarrow{MA} + \\overrightarrow{MB} + 2\\overrightarrow{MC} = \\vec{0}$.</p>\n            <div class=\"ex-item\" style=\"font-size:19px;\">\n              <b>a) Chứng minh $M$ là trung điểm của $IC$:</b><br/>\n              • Vì $I$ là trung điểm của đoạn $AB$ nên với điểm $M$ bất kỳ, ta luôn có:<br/>\n              $$\\overrightarrow{MA} + \\overrightarrow{MB} = 2\\overrightarrow{MI}$$\n              • Thay vào giả thiết:\n              $$2\\overrightarrow{MI} + 2\\overrightarrow{MC} = \\vec{0} \\iff \\overrightarrow{MI} + \\overrightarrow{MC} = \\vec{0}$$\n              $\\implies M$ chính là trung điểm của đoạn thẳng $IC$.\n            </div>\n            <div class=\"ex-item\" style=\"font-size:19px; margin-top:10px;\">\n              <b>b) Biểu diễn $\\overrightarrow{AM}$ theo $\\overrightarrow{AB}$ và $\\overrightarrow{AC}$:</b><br/>\n              • Vì $M$ là trung điểm $IC \\implies \\overrightarrow{AM} = \\dfrac{1}{2}\\left(\\overrightarrow{AI} + \\overrightarrow{AC}\\right)$.<br/>\n              • Mà $I$ là trung điểm $AB \\implies \\overrightarrow{AI} = \\dfrac{1}{2}\\overrightarrow{AB}$.<br/>\n              $$\\implies \\overrightarrow{AM} = \\dfrac{1}{2}\\left(\\dfrac{1}{2}\\overrightarrow{AB} + \\overrightarrow{AC}\\right) = \\mathbf{\\dfrac{1}{4}\\overrightarrow{AB} + \\dfrac{1}{2}\\overrightarrow{AC}}.$$\n            </div>\n          </div>\n        </div>\n        "

    "html": "\n        <div class=\"s-kicker\">📊 CHUYÊN ĐỀ 6 · CÁC SỐ ĐẶC TRƯNG CỦA MẪU SỐ LIỆU (20 PHÚT)</div>\n        <h2 class=\"s-title\">6.2. Phương Sai $s^2$, Độ Lệch Chuẩn $s$ &amp; Giá Trị Bất Thường (Outliers)</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Công thức Độ phân tán &amp; Ngưỡng bất thường</span>\n            <h3>1. Hệ thống công thức đo độ phân tán</h3>\n            <div class=\"eq-box\" style=\"font-size:21px; padding:12px; margin-bottom:10px; text-align:left;\">\n              • <b>Khoảng biến thiên:</b> $R = x_{\\max} - x_{\\min}$<br/>\n              • <b>Khoảng tứ phân vị:</b> $\\Delta_Q = Q_3 - Q_1$<br/>\n              • <b>Phương sai:</b> $s^2 = \\dfrac{1}{n}\\sum_{i=1}^n (x_i - \\bar{x})^2$<br/>\n              • <b>Độ lệch chuẩn:</b> $s = \\sqrt{s^2}$\n            </div>\n            <div class=\"warn-banner\" style=\"font-size:19.5px;\">\n              🚨 <b>Quy tắc phát hiện Giá trị bất thường (Outlier):</b><br/>\n              Giá trị $x$ là bất thường nếu nằm ngoài đoạn $\\big[Q_1 - 1{,}5\\Delta_Q;\\ Q_3 + 1{,}5\\Delta_Q\\big]$, tức là:<br/>\n              $$\\mathbf{x < Q_1 - 1{,}5\\Delta_Q} \\quad\\text{hoặc}\\quad \\mathbf{x > Q_3 + 1{,}5\\Delta_Q}$$\n            </div>\n          </div>\n          <div class=\"card\" style=\"background:#F0FDF4; border-color:#A7F3D0;\">\n            <span class=\"tag\" style=\"background:#0F6B55; color:#fff;\">Giải mẫu Bài 17 &amp; Bài 18 Tự luận (Bộ 2)</span>\n            <h3 style=\"color:#0F6B55;\">2. Thực hành tính toán chuẩn xác</h3>\n            <div class=\"ex-item\" style=\"font-size:18.5px;\">\n              <b>📌 Bài 17 (Bộ 2):</b> Mẫu $n=12$ học sinh:<br/>\n              $\\underbrace{1;\\ 2;\\ 2;\\ 3;\\ 3;\\ 3}_{\\text{Nửa trái (6 số)}} \\ \\big|\\ \\underbrace{4;\\ 4;\\ 5;\\ 6;\\ 7;\\ 12}_{\\text{Nửa phải (6 số)}}$<br/>\n              • $\\bar{x} = \\dfrac{52}{12} \\approx 4{,}33$; \\quad $M_e = Q_2 = \\dfrac{3+4}{2} = 3{,}5$.<br/>\n              • $Q_1 = \\dfrac{2+3}{2} = 2{,}5$; \\quad $Q_3 = \\dfrac{5+6}{2} = 5{,}5 \\implies \\Delta_Q = 5{,}5 - 2{,}5 = \\mathbf{3}$.<br/>\n              • Ngưỡng chuẩn: $[2{,}5 - 1{,}5(3);\\ 5{,}5 + 1{,}5(3)] = \\mathbf{[-2;\\ 10]}$.<br/>\n              $\\implies$ Giá trị <b>$12 > 10$</b> nên <b>$12$ là giá trị bất thường</b>!\n            </div>\n            <div class=\"ex-item\" style=\"font-size:18.5px; margin-top:10px;\">\n              <b>📌 Bài 18 (Bộ 2):</b> Mẫu $3;\\ 5;\\ 6;\\ 8;\\ 8$ ($n=5$) có $\\bar{x} = \\dfrac{30}{5} = 6$:<br/>\n              $$s^2 = \\dfrac{(3-6)^2 + (5-6)^2 + (6-6)^2 + (8-6)^2 + (8-6)^2}{5} = \\dfrac{9+1+0+4+4}{5} = \\mathbf{3{,}6}$$\n              $$\\implies \\text{Độ lệch chuẩn: } s = \\sqrt{3{,}6} \\approx \\mathbf{1{,}90}.$$\n            </div>\n          </div>\n        </div>\n        "
  },
  {
    "title": "Tổng Kết 3 Tiếng Lý Thuyết & 10 Cạm Bẫy Cần Tránh",
    "kicker": "Tổng kết · 2:57 – 3:00",

    "time_badge": "Hoàn tất 180 phút",
    "html": "\n        <div class=\"s-kicker\">🏆 TỔNG KẾT 180 PHÚT LÝ THUYẾT · SẴN SÀNG BƯỚC VÀO PHẦN LÀM BÀI TẬP RIÊNG</div>\n        <h2 class=\"s-title\">10 Quy Tắc Vàng Chống Mất Điểm Oan Khi Giải 2 Đề Thi</h2>\n        <div class=\"g2\" style=\"flex:1; align-items:stretch;\">\n          <div class=\"card\">\n            <span class=\"tag\">Đại số &amp; Giải tích (Chuyên đề 1, 2, 3, 6)</span>\n            <ol style=\"font-size:19.5px; line-height:1.52; padding-left:24px; margin:0;\">\n              <li><b>Phủ định mệnh đề:</b> $\\overline{\\forall x, x^2 > 2}$ là $\\exists x, x^2 \\le 2$ (nhớ dấu bằng).</li>\n              <li><b>Hiệu hai tập hợp:</b> Với $A=[-1;4),\\ B=[2;+\\infty)$, điểm $4 \\notin A$ nên khi lấy $B\\setminus A$ thì $4$ vẫn còn lại $\\rightarrow [4;+\\infty)$.</li>\n              <li><b>Đọc hệ BPT từ hình vẽ:</b> Luôn kiểm tra bờ nét liền ($\\le,\\ge$) hay nét đứt ($<,>$) trước, rồi lấy 1 điểm không thuộc cả 2 bờ để thử dấu.</li>\n              <li><b>Hàm nhiều công thức:</b> Xác định rõ $x_0$ thuộc miền nào mới thay vào công thức nhánh đó.</li>\n              <li><b>Tứ phân vị &amp; Outliers:</b> Luôn sắp xếp mẫu tăng dần trước khi tìm $M_e, Q_1, Q_3$ và kiểm tra ngưỡng $[Q_1 - 1{,}5\\Delta_Q;\\ Q_3 + 1{,}5\\Delta_Q]$.</li>\n            </ol>\n          </div>\n          <div class=\"card\" style=\"background:#F0FDF4; border-color:#A7F3D0;\">\n            <span class=\"tag\" style=\"background:#0F6B55; color:#fff;\">Hình học &amp; Đo lường (Chuyên đề 3, 4, 5)</span>\n            <ol start=\"6\" style=\"font-size:19.5px; line-height:1.52; padding-left:24px; margin:0;\">\n              <li><b>Cổng Parabol:</b> Đặt gốc $O(0;0)$ tại trung điểm chân cổng $AB$, đỉnh $G(0;h)$ trên trục $Oy \\Rightarrow (P): y = ax^2 + h$ là nhanh nhất.</li>\n              <li><b>Góc tù ($90^\\circ < \\alpha < 180^\\circ$):</b> $\\sin\\alpha > 0$ nhưng $\\cos\\alpha < 0,\\ \\tan\\alpha < 0$.</li>\n              <li><b>Định lý Sin:</b> $\\dfrac{a}{\\sin A} = 2R \\implies R = \\dfrac{a}{2\\sin A}$ (không quên số $2$ ở mẫu).</li>\n              <li><b>Quy tắc hiệu Vectơ:</b> $\\overrightarrow{BE} = \\overrightarrow{AE} - \\overrightarrow{AB} = -\\overrightarrow{AB} + \\dfrac{5}{6}\\overrightarrow{AC}$.</li>\n              <li><b>Chứng minh 3 điểm $A, I, H$ thẳng hàng:</b> Biểu diễn $\\overrightarrow{AH}$ và $\\overrightarrow{AI}$ theo 2 vectơ gốc $\\vec{u}=\\overrightarrow{AB}, \\vec{v}=\\overrightarrow{AC}$ rồi lập tỉ số hệ số.</li>\n            </ol>\n          </div>\n        </div>\n        "
  }

let cur = 0;
const scaler = document.getElementById('scaler');

function fit() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const k = Math.min(w / 1600, h / 900);
  scaler.style.transform = `translate(-50%, -50%) scale(${k})`;
}

function slideHtml(s, i) {
  if (s.is_cover) {
    return `
    <section class="slide cover">
      <div class="s-body">${s.html}</div>
    </section>`;
  }
  return `
  <section class="slide">
    <div class="s-body">
      ${s.html}
    </div>
    <div class="s-foot">
      
      <span style="font-weight:700; color:var(--lam);">Giáo Án Lý Thuyết Toán 10 (3 Tiếng) – ThS. Đinh Quốc Tuấn</span>
      <span class="grow"></span>
      <span class="time-pill">⏱ ${s.time_badge || '180 phút'}</span>
      <span class="num">${i + 1} / ${S.length}</span>
      <span class="sen-box"></span>
    </div>
  </section>`;
}

function go(i) {
  if (i < 0) i = 0;
  if (i >= S.length) i = S.length - 1;
  cur = i;
  scaler.innerHTML = slideHtml(S[i], i);
  scaler.firstElementChild.classList.add('enter');
  document.getElementById('pos').innerText = `${i + 1} / ${S.length}`;
  document.getElementById('progress').style.width = `${((i + 1) / S.length) * 100}%`;

  // Đồng bộ dropdown chuyên đề
  const sel = document.getElementById('topicJump');
  if (sel) {
    const starts = [17, 15, 12, 10, 7, 5, 2, 0];
    for (const st of starts) {
      if (i >= st) { sel.value = String(st); break; }
    }
  }

  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([scaler]);
  }
}

function jumpTopic(val) {
  const idx = parseInt(val, 10);
  if (!isNaN(idx)) go(idx);
}

function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {});
  } else {
    document.exitFullscreen();
  }
}

function openModal(id) {
  document.getElementById(id).classList.add('on');
  if (id === 'mOverview') buildOverview();
}
function closeModals() {
  document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on'));
}

function buildOverview() {
  document.getElementById('ovList').innerHTML = S.map((s, idx) => `
    <button type="button" class="ov-btn ${idx === cur ? 'cur' : ''}" onclick="closeModals(); go(${idx});">
      <small>Slide ${idx + 1} · ${s.time_badge || ''}</small>
      <b>${s.title}</b>
    </button>
  `).join('');
}

async function printAllSlides() {
  const pr = document.getElementById('print');
  pr.innerHTML = S.map((s, idx) => slideHtml(s, idx)).join('');
  if (window.MathJax && window.MathJax.typesetPromise) {
    await window.MathJax.typesetPromise([pr]);
  }
  window.print();
}

let tLeft = 180 * 60, tRun = false, tInt = null;
function tShow() {
  const m = Math.floor(tLeft / 60);
  const s = tLeft % 60;
  document.getElementById('timerV').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function timerStart(min) {
  tLeft = min * 60;
  tRun = true;
  document.getElementById('timer').classList.add('on');
  tShow();
  clearInterval(tInt);
  tInt = setInterval(() => {
    if (!tRun) return;
    tLeft--;
    tShow();
    if (tLeft <= 0) {
      clearInterval(tInt);
      tRun = false;
      alert('Đã hết thời lượng giảng dạy lý thuyết!');
    }
  }, 1000);
}
document.getElementById('timerP').onclick = function() {
  tRun = !tRun;
  this.innerText = tRun ? 'Tạm dừng' : 'Tiếp tục';
};
document.getElementById('timerX').onclick = function() {
  clearInterval(tInt);
  document.getElementById('timer').classList.remove('on');
};

let hideTimer = null;
function showControls() {
  document.body.classList.add('show-ctrl');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => document.body.classList.remove('show-ctrl'), 3200);
}
document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls, { passive: true });

document.addEventListener('keydown', (e) => {
  if (document.querySelector('.modal.on')) {
    if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') closeModals();
    return;
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') {
    e.preventDefault();
    go(cur + 1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') {
    e.preventDefault();
    go(cur - 1);
  } else if (k === 'Home') {
    go(0);
  } else if (k === 'End') {
    go(S.length - 1);
  } else if (k === 'f' || k === 'F') {
    toggleFull();
  } else if (k === 'o' || k === 'O') {
    openModal('mOverview');
  } else if (k === 't' || k === 'T') {
    timerStart(180);
  }
});

window.addEventListener('resize', fit);
window.addEventListener('DOMContentLoaded', () => {
  fit();
  go(0);
});
</script>
