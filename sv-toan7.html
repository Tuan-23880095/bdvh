<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Toán 7 – Phòng Tương Tác Học Sinh · ThS. Đinh Quốc Tuấn</title>
  <link rel="icon" type="image/svg+xml" href="https://diemdanhsv.com/images/logo-sen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  
  <!-- MathJax 3 Cấu Hình An Toàn -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Stylesheet Slido Chuyên Biệt -->
  <link rel="stylesheet" href="assets/slido/slido-theme.css"/>
</head>
<body class="slido-student-body">

  <!-- HEADER HỌC SINH DI ĐỘNG -->
  <header class="stu-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; background:#fff; border-radius:8px; padding:3px; display:flex; align-items:center; justify-content:center;">
        <img src="https://diemdanhsv.com/images/logo-sen.svg" alt="Logo" style="width:100%; height:100%; object-fit:contain;"/>
      </div>
      <div>
        <h1 style="font-size:14px; font-weight:700; font-family:var(--serif); color:#fff; line-height:1.2;">
          Lớp Toán 7
        </h1>
        <p style="font-size:11px; color:#CBD5E1; line-height:1;">
          ThS. Đinh Quốc Tuấn · HCMUS
        </p>
      </div>
    </div>

    <div onclick="window.slidoStudent.changeName()" style="display:flex; align-items:center; gap:6px; font-size:12px; background:rgba(255,255,255,0.15); padding:5px 12px; border-radius:20px; cursor:pointer;">
      <span class="live-dot" style="width:7px; height:7px;"></span>
      <span id="header-student-name">Học sinh</span>
      <span style="font-size:10px; opacity:0.8;">✎</span>
    </div>
  </header>

  <!-- KHUNG HIỂN THỊ NỘI DUNG ỨNG DỤNG -->
  <main style="flex:1; max-width:600px; width:100%; margin:0 auto; padding-bottom:30px;">
    <div id="student-app-root">
      <!-- Nội dung được sinh động từ slido-student.js -->
    </div>
  </main>

  <footer style="text-align:center; padding:12px; font-size:11px; color:#94A3B8; border-top:1px solid #E2E8F0; margin-top:auto;">
    © Bồi Dưỡng Văn Hóa HCMUS · Nền tảng học tập ThS. Đinh Quốc Tuấn
  </footer>

  <script src="assets/slido/toan7-data.js"></script>
  <script src="assets/slido/slido-student.js"></script>
  <script>
    // Cập nhật tên học sinh trên header
    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('slido_student_name');
      const el = document.getElementById('header-student-name');
      if (el && name) el.innerText = name;
    });
  </script>
</body>
</html>
