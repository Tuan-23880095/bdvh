<title>Bài Giảng Toán 7 – ThS. Đinh Quốc Tuấn · HCMUS</title>
<link rel="icon" type="image/svg+xml" href="https://diemdanhsv.com/images/logo-sen.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --luc: #0F6B55;
  --luc-non: #46A385;
  --lam: #1F4E79;
  --muc: #10212B;
  --giay: #F6F7F3;
  --bac: #D5DCE1;
  --son: #D2492A;
  --tho: #D6A130;
  --line: #D5DCE1;
  --card: #FFFFFF;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Be Vietnam Pro', 'Plus Jakarta Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; margin: 0; background: #0d1a26; }

/* Sân khấu 1600x900 co giãn vừa mọi màn hình */
#stage { position: fixed; inset: 0; overflow: hidden; }
#scaler {
  width: 1600px;
  height: 900px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center center;
}

.slide {
  position: absolute;
  inset: 0;
  background: var(--giay);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 25px 70px rgba(0,0,0,.45);
  display: flex;
  flex-direction: column;
  font-family: var(--sans);
  font-size: 25px;
  line-height: 1.5;
  padding: 48px 72px 0;
  color: var(--muc);
}

.slide.enter { animation: sIn .32s cubic-bezier(.2,.8,.2,1); }
@keyframes sIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.s-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.s-foot {
  height: 64px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  border-top: 1px solid var(--line);
  margin: 0 -72px;
  padding: 0 72px;
  font-size: 17px;
  color: #5A6A78;
}
.s-foot img.hcmus { height: 36px; width: auto; }
.s-foot .sen { width: 36px; height: 36px; }
.s-foot .grow { flex: 1; }
.s-foot .num { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muc); }

.s-kicker {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--lam);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.s-kicker::before {
  content: "";
  width: 34px;
  height: 4px;
  border-radius: 2px;
  background: currentColor;
}
.s-kicker.sec-q { color: #1D4ED8; }
.s-kicker.sec-ans { color: #D97706; }
.s-kicker.sec-sol { color: var(--luc); }

.s-title {
  font: 700 46px/1.2 var(--serif);
  color: var(--muc);
  margin: 0 0 20px;
  letter-spacing: -.01em;
}

/* Lưới phương án trắc nghiệm */
.opts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 16px;
}
.opts-grid.single-col { grid-template-columns: 1fr; }

.opt-box {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 26px;
  box-shadow: 0 4px 12px rgba(16,33,43,.04);
  transition: all .2s;
}
.opt-label {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #E8EEF5;
  color: var(--lam);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  flex: none;
}
.opt-text { flex: 1; }

.opt-box.correct {
  background: #ECFDF5;
  border-color: #10B981;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.2);
}
.opt-box.correct .opt-label {
  background: #10B981;
  color: #fff;
}

/* Banner chốt đáp án */
.ans-chot-bar {
  margin-top: 28px;
  background: #FEF3C7;
  border: 2px solid #F59E0B;
  border-radius: 16px;
  padding: 20px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ans-chot-title {
  font-size: 28px;
  font-weight: 800;
  color: #92400E;
  display: flex;
  align-items: center;
  gap: 14px;
}
.ans-chot-hint {
  font-size: 20px;
  font-weight: 700;
  color: #B45309;
}

/* Khung Lời giải chi tiết */
.sol-box {
  background: #F0FDF4;
  border-left: 8px solid var(--luc);
  border-radius: 16px;
  padding: 28px 34px;
  font-size: 25px;
  line-height: 1.75;
  box-shadow: 0 8px 24px rgba(15,107,85,.08);
  margin-top: 10px;
  overflow-y: auto;
  max-height: 520px;
}
.sol-box-title {
  font: 700 30px/1.2 var(--serif);
  color: var(--luc);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Slide Bìa (Cover) */
.slide.cover {
  background: radial-gradient(1200px 700px at 85% 10%, #E3F1EA 0%, transparent 60%), var(--giay);
  padding: 58px 84px;
}
.cover-logos { display: flex; align-items: center; gap: 26px; margin-bottom: 34px; }
.cover-logos img.hcmus { height: 84px; }
.cover-logos .sep { width: 2px; height: 64px; background: var(--line); }
.cover-logos .sen { width: 78px; height: 78px; background: #fff; border-radius: 20%; padding: 7px; box-shadow: 0 2px 10px rgba(16,33,43,.08); }
.cover-title { font: 700 76px/1.12 var(--serif); margin: 0 0 16px; letter-spacing: -.02em; color: var(--muc); }
.cover-title em { font-style: normal; color: var(--luc); }
.cover-sub { font-size: 28px; color: #5A6A78; max-width: 980px; margin: 0 0 36px; }
.cover-person {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 26px;
  width: fit-content;
}
.cover-av {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--lam);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 24px var(--serif);
}

/* Điều khiển (tự ẩn) */
#ctrl {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(16,33,43,.92);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  transition: opacity .25s;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
body.show-ctrl #ctrl, #ctrl:hover { opacity: 1; }
#ctrl button, #ctrl a {
  background: transparent;
  border: 0;
  color: #fff;
  font: inherit;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: background .15s;
}
#ctrl button:hover, #ctrl a:hover { background: rgba(255,255,255,.16); }
#ctrl .pos { font-variant-numeric: tabular-nums; padding: 0 8px; font-weight: 700; }

/* Progress bar */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  background: var(--luc);
  z-index: 100;
  transition: width .2s;
}

/* Modal Tổng quan (O) */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(16,33,43,.65);
  backdrop-filter: blur(4px);
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
.modal.on { display: flex; }
.panel {
  background: #fff;
  border-radius: 20px;
  width: min(1200px, 96vw);
  max-height: 88vh;
  overflow-y: auto;
  padding: 32px 40px;
  box-shadow: 0 30px 80px rgba(0,0,0,.4);
}
.panel h2 { font: 700 32px var(--serif); margin: 0 0 16px; color: var(--muc); }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 20px; }
.ov-btn {
  text-align: left;
  border: 1px solid var(--line);
  background: var(--giay);
  border-radius: 12px;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.4;
  transition: all .15s;
}
.ov-btn:hover { border-color: var(--luc); background: #E3F1EA; }
.ov-btn.cur { border-color: var(--luc); background: #E3F1EA; font-weight: 700; }
.ov-btn small { display: block; color: #5A6A78; font-size: 13px; margin-bottom: 4px; }

/* Đồng hồ hẹn giờ (T) */
#timer {
  position: fixed;
  top: 24px;
  right: 28px;
  z-index: 40;
  background: rgba(16,33,43,.92);
  color: #fff;
  border-radius: 14px;
  padding: 8px 18px;
  display: none;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
#timer.on { display: flex; }
#timer button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 700; cursor: pointer; }

/* In (Ctrl+P) */
@media print {
  @page { size: 1600px 900px; margin: 0; }
  html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
  #stage, #ctrl, #progress, #timer, .modal { display: none !important; }
  #print { display: block !important; }
  #print .slide { position: relative; width: 1600px; height: 900px; box-shadow: none; border-radius: 0; break-after: page; }
}
</style>

let cur = 0;
const scaler = document.getElementById('scaler');

function fit() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const k = Math.min(w / 1600, h / 900);
  scaler.style.transform = `translate(-50%, -50%) scale(${k})`;
}

function slideHtml(s, i) {
  if (s.is_cover) {
    return `
    <section class="slide cover">
      <div class="s-body">${s.html}</div>
    </section>`;
  }
  return `

      <span style="font-weight:600;">Lớp Toán 7 – ThS. Đinh Quốc Tuấn · Trung Tâm Bồi Dưỡng Văn Hóa HCMUS</span>
      <span class="grow"></span>
      <span class="num">${i + 1} / ${S.length}</span>
      <img class="sen" src="${LOGO_SEN}" alt="Sen">
    </div>
  </section>`;
}

function go(i) {
  if (i < 0) i = 0;
  if (i >= S.length) i = S.length - 1;
  cur = i;
  scaler.innerHTML = slideHtml(S[i], i);
  scaler.firstChild.classList.add('enter');
  document.getElementById('pos').innerText = `${i + 1} / ${S.length}`;
  document.getElementById('progress').style.width = `${((i + 1) / S.length) * 100}%`;
  
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([scaler]);
  }
}

function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {});
  } else {
    document.exitFullscreen();
  }
}

function openModal(id) {
  document.getElementById(id).classList.add('on');
  if (id === 'mOverview') buildOverview();
}
function closeModals() {
  document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on'));
}

function buildOverview() {
  document.getElementById('ovList').innerHTML = S.map((s, idx) => `
    <button type="button" class="ov-btn ${idx === cur ? 'cur' : ''}" onclick="closeModals(); go(${idx});">
      <small>Slide ${idx + 1} · ${s.kicker || ''}</small>
      <b>${s.title}</b>
    </button>
  `).join('');
}

let tLeft = 300, tRun = false, tInt = null;
function tShow() {
  const m = Math.floor(tLeft / 60);
  const s = tLeft % 60;
  document.getElementById('timerV').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function timerStart(min) {
  tLeft = min * 60;
  tRun = true;
  document.getElementById('timer').classList.add('on');
  tShow();
  clearInterval(tInt);
  tInt = setInterval(() => {
    if (!tRun) return;
    tLeft--;
    tShow();
    if (tLeft <= 0) {
      clearInterval(tInt);
      tRun = false;
      alert('Hết thời gian làm bài!');
    }
  }, 1000);
}
document.getElementById('timerP').onclick = function() {
  tRun = !tRun;
  this.innerText = tRun ? 'Tạm dừng' : 'Tiếp tục';
};
document.getElementById('timerX').onclick = function() {
  clearInterval(tInt);
  document.getElementById('timer').classList.remove('on');
};

let hideTimer = null;
function showControls() {
  document.body.classList.add('show-ctrl');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => document.body.classList.remove('show-ctrl'), 2500);
}
document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls, { passive: true });

document.addEventListener('keydown', (e) => {
  if (document.querySelector('.modal.on')) {
    if (e.key === 'Escape') closeModals();
    return;
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') {
    e.preventDefault();
    go(cur + 1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') {
    e.preventDefault();
    go(cur - 1);
  } else if (k === 'Home') {
    go(0);
  } else if (k === 'End') {
    go(S.length - 1);
  } else if (k === 'f' || k === 'F') {
    toggleFull();
  } else if (k === 'o' || k === 'O') {
    openModal('mOverview');
  } else if (k === 't' || k === 'T') {
    timerStart(5);
  } else if (k === 'b' || k === 'B') {
    const st = document.getElementById('stage');
    st.style.opacity = st.style.opacity === '0' ? '1' : '0';
  } else if (k === '1' || k === '2' || k === '3') {
    // Jump between Question (1), Answer (2), Solution (3) within triad
    if (cur > 0) {
      const baseIdx = Math.floor((cur - 1) / 3) * 3 + 1;
      const target = baseIdx + (parseInt(k) - 1);
      if (target < S.length) go(target);
    }
  }
});

window.addEventListener('resize', fit);
window.addEventListener('DOMContentLoaded', () => {
  fit();
  go(0);
});
</script>
</body>
</html>
