<style>
:root {
  --luc: #0F6B55;
  --luc-sang: #10B981;
  --luc-nhe: #ECFDF5;
  --lam: #1F4E79;
  --lam-dam: #102A43;
  --vang: #D97706;
  --vang-sang: #F59E0B;
  --do: #DC2626;
  --giay: #F6F7F3;
  --muc: #10212B;
  --xam-nen: #E2E8F0;
  --line: #CBD5E1;
  --card: #FFFFFF;
  --serif: 'Times New Roman', Times, 'Source Serif 4', Georgia, serif;
  --sans: 'Be Vietnam Pro', -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #0B1924;
  color: var(--muc);
  font-family: var(--sans);
  user-select: none;
}

/* Sân khấu 16:9 co giãn */
#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#scaler {
  width: 1600px;
  height: 900px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: center center;
  transform: translate(-50%, -50%);
  background: var(--giay);
  border-radius: 8px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Slide chuẩn */
.slide {
  position: absolute;
  inset: 0;
  background: var(--giay);
  display: flex;
  flex-direction: column;
  padding: 34px 54px 14px;
  opacity: 1;
  transition: opacity .22s ease;
}
.slide.enter {
  animation: slideFadeIn .28s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.s-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Footer slide */
.s-foot {
  height: 50px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  border-top: 1px solid var(--line);
  margin: 0 -54px;
  padding: 0 54px;
  font-size: 15px;
  color: #64748B;
  background: #FAFAFA;
}
.s-foot img.hcmus { height: 28px; width: auto; }
.s-foot .sen { width: 28px; height: 28px; background: #fff; border-radius: 6px; padding: 2px; }
.s-foot .grow { flex: 1; }
.s-foot .num { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--lam); font-size: 17px; }

/* Kicker & Title chuẩn phông chữ Toán học */
.s-kicker {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin: 0 0 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
}
.s-kicker::before {
  content: "";
  width: 28px;
  height: 4px;
  border-radius: 2px;
  background: currentColor;
}
.sec-q { color: var(--lam); }
.sec-ans { color: var(--luc); }
.sec-sol { color: #854D0E; }

.s-title {
  font: 700 36px/1.25 var(--serif);
  color: var(--muc);
  margin: 0 0 14px;
  letter-spacing: 0;
}

/* Bố cục 2 cột: Đề bài + Slido Interactive */
.slido-layout {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 32px;
  flex: 1;
  min-height: 0;
}

/* Cột trái: Nội dung câu hỏi chuẩn Times New Roman */
.q-pane {
  display: flex;
  flex-direction: column;
}
.q-desc {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1.45;
  color: #0F172A;
  margin-bottom: 16px;
}

/* Lưới 4 phương án */
.opts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 4px;
}
.opts-grid.single-col { grid-template-columns: 1fr; }

.opt-box {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 24px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.03);
  transition: all .2s;
}
.opt-label {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: #E8EEF5;
  color: var(--lam);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  flex: none;
  font-family: var(--sans);
}
.opt-text {
  flex: 1;
  font-family: var(--serif);
  font-size: 24px;
}

.opt-box.correct {
  background: var(--luc-nhe);
  border-color: var(--luc-sang);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
}
.opt-box.correct .opt-label {
  background: var(--luc-sang);
  color: #fff;
}

/* Cột phải: Khung Slido Live Polling */
.slido-pane {
  background: #FFFFFF;
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 18px 22px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 20px rgba(16,33,43,0.05);
}

.slido-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #FEE2E2;
  color: #B91C1C;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  padding: 3px 10px;
  border-radius: 99px;
  font-family: var(--sans);
}
.live-pill.active {
  background: #DCFCE7;
  color: #15803D;
}
.live-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
  animation: dotPulse 1.8s infinite;
}
@keyframes dotPulse {
  70% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
  100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}

.slido-stat {
  font-size: 15px;
  font-weight: 700;
  color: var(--lam);
  font-family: var(--sans);
}

/* Thanh kết quả bình chọn Slido */
.slido-bars {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.bar-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.bar-meta {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 700;
  color: #334155;
  font-family: var(--sans);
}
.bar-track {
  height: 34px;
  background: #F1F5F9;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  border: 1px solid #E2E8F0;
}
.bar-fill {
  height: 100%;
  border-radius: 7px;
  transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  padding-left: 12px;
  font-weight: 800;
  font-size: 15px;
  color: #FFFFFF;
  font-family: var(--sans);
}
.fill-A { background: linear-gradient(90deg, #3B82F6, #2563EB); }
.fill-B { background: linear-gradient(90deg, #10B981, #059669); }
.fill-C { background: linear-gradient(90deg, #F59E0B, #D97706); }
.fill-D { background: linear-gradient(90deg, #8B5CF6, #7C3AED); }

.bar-row.highlight .bar-track {
  border: 2px solid var(--luc-sang);
  background: #F0FDF4;
}

/* Box Quét QR tham gia */
.slido-join {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
}
.qr-mini {
  width: 72px;
  height: 72px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qr-mini svg { width: 100%; height: 100%; }
.join-info b { font-size: 15px; color: var(--muc); display: block; font-family: var(--sans); }
.join-info code {
  font-size: 14px;
  color: var(--luc);
  font-weight: 700;
  background: #ECFDF5;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--sans);
}

/* Slide Đáp án & Giải thích */
.ans-banner {
  background: #FEF3C7;
  border: 2px solid #F59E0B;
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
}
.ans-banner-title {
  font-size: 24px;
  font-weight: 800;
  color: #92400E;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--sans);
}

/* Hộp Lời giải & Kiến thức chuẩn Times New Roman */
.sol-layout {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 26px;
  flex: 1;
  min-height: 0;
}
.sol-box {
  background: #FFFFFF;
  border-left: 8px solid var(--luc);
  border-radius: 14px;
  padding: 22px 26px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.04);
  overflow-y: auto;
  font-size: 23px;
  line-height: 1.65;
  font-family: var(--serif);
}
.theory-box {
  background: #EFF6FF;
  border-left: 8px solid #2563EB;
  border-radius: 14px;
  padding: 22px 26px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.04);
  overflow-y: auto;
  font-size: 22px;
  line-height: 1.6;
  font-family: var(--serif);
}
.box-title {
  font: 700 24px/1.2 var(--sans);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sol-box .box-title { color: var(--luc); }
.theory-box .box-title { color: #1D4ED8; }

/* Bìa Slide */
.slide.cover {
  background: radial-gradient(1200px 700px at 85% 10%, #E3F1EA 0%, transparent 60%), var(--giay);
  padding: 44px 74px;
}
.cover-logos { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
.cover-logos img.hcmus { height: 74px; }
.cover-logos .sep { width: 2px; height: 56px; background: var(--line); }
.cover-logos .sen { width: 68px; height: 68px; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.cover-title { font: 700 64px/1.12 var(--serif); margin: 0 0 12px; letter-spacing: 0; color: var(--muc); }
.cover-title em { font-style: normal; color: var(--luc); }
.cover-sub { font-size: 25px; color: #475569; max-width: 980px; margin: 0 0 28px; line-height: 1.4; font-family: var(--serif); }

.cover-bottom {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 36px;
  align-items: center;
  margin-top: auto;
}
.teacher-badge {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 22px;
}
.teacher-av {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--lam);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 22px var(--sans);
}

.join-big-card {
  background: #fff;
  border: 2px solid var(--luc);
  border-radius: 18px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 8px 24px rgba(15,107,85,0.12);
}
.join-big-card .qr-svg { width: 130px; height: 130px; }
.join-big-card b { font-size: 18px; margin: 8px 0 4px; color: var(--muc); font-family: var(--sans); }
.join-big-card code { font-size: 16px; color: var(--luc); font-weight: 800; font-family: var(--sans); }

/* =====================================================================
   THANH ĐIỀU KHIỂN SIÊU GỌN - ĐẶT TẠI GÓC DƯỚI BÊN PHẢI
   ===================================================================== */
#ctrl {
  position: fixed;
  right: 18px;
  bottom: 10px;
  left: auto;
  transform: none;
  display: flex;
  gap: 4px;
  align-items: center;
  background: rgba(16, 33, 43, 0.9);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  z-index: 50;
  opacity: 0.45;
  transition: opacity .2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
body.show-ctrl #ctrl, #ctrl:hover {
  opacity: 1;
}
#ctrl button, #ctrl a {
  background: transparent;
  border: 0;
  color: #fff;
  font: inherit;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  transition: background .12s;
  white-space: nowrap;
}
#ctrl button:hover, #ctrl a:hover {
  background: rgba(255,255,255,0.22);
}
#ctrl .pos {
  font-variant-numeric: tabular-nums;
  padding: 0 6px;
  font-weight: 800;
  color: #FBBF24;
  font-size: 13px;
}
#ctrl .sep {
  opacity: 0.3;
  padding: 0 2px;
}

/* Progress bar */
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  background: var(--luc-sang);
  z-index: 100;
  transition: width .2s;
}

/* Modal Tổng quan (O) */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(16,33,43,0.65);
  backdrop-filter: blur(5px);
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
.modal.on { display: flex; }
.panel {
  background: #fff;
  border-radius: 18px;
  width: 1050px;
  max-width: 95vw;
  max-height: 85vh;
  padding: 26px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 70px rgba(0,0,0,0.3);
}
.ov-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  overflow-y: auto;
  margin-top: 16px;
  padding-right: 6px;
}
.ov-btn {
  background: #F8FAFC;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
}
.ov-btn:hover { background: #E2E8F0; }
.ov-btn.cur { border-color: var(--luc); background: var(--luc-nhe); }
.ov-btn small { display: block; font-size: 11px; color: #64748B; font-weight: 700; text-transform: uppercase; font-family: var(--sans); }
.ov-btn b { display: block; font-size: 14px; color: var(--muc); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--serif); }

/* Đồng hồ đếm ngược */
#timer {
  position: fixed;
  top: 14px;
  right: 20px;
  background: rgba(16,33,43,0.92);
  color: #fff;
  padding: 6px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  display: none;
  align-items: center;
  gap: 10px;
  z-index: 50;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}
#timer.on { display: flex; }
#timer button { background: transparent; border: 0; color: #CBD5E1; cursor: pointer; font-size: 13px; }
#timer button:hover { color: #fff; }
</style>

<script>
const LOGO_HCMUS = 'https://firebasestorage.googleapis.com/v0/b/link-anh-web.firebasestorage.app/o/Logo-chinh-hcmus.png?alt=media&token=9cf3a1de-75f1-493b-8711-fd22c7b98738';
const LOGO_SEN = 'https://diemdanhsv.com/images/logo-sen.svg';
const STUDENT_URL = 'https://bdvh.diemdanhsv.com/sv-toan7.html';

function makeQrSvg(text, size) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: size || 4, margin: 0, scalable: true });
  } catch(e) {
    return `<div style="font-size:11px; text-align:center;">${text}</div>`;
  }
}

// 12 CÂU HỎI ĐỀ THI TOÁN 7 - ĐÃ CHUẨN HOÁ LATEX & TYPOGRAPHY
const EXAM_QUESTIONS = [
  {
    id: 1,
    title: "Tập hợp các số hữu tỉ",
    desc: "Tập hợp các số hữu tỉ được kí hiệu là",
    opts: [
      { k: "A", t: "$\\mathbb{N}$" },
      { k: "B", t: "$\\mathbb{Z}$" },
      { k: "C", t: "$\\mathbb{Q}$" },
      { k: "D", t: "$\\mathbb{R}$" }
    ],

            <div class="qr-mini">${makeQrSvg(STUDENT_URL, 2)}</div>
            <div class="join-info">
              <b>Vào làm trực tiếp:</b>
              <code>${STUDENT_URL.replace('https://', '')}</code>
            </div>
          </div>
        </div>
      </div>
    `
  });

  // SLIDE 2: ĐÁP ÁN CHÍNH XÁC
  S.push({
    q_id: q.id,
    slide_type: 'answer',
    title: `Câu ${q.id} (Đáp án ${q.correct}) - ${q.title}`,
    kicker: `CÂU ${q.id} / 12 · BƯỚC 2/3 (CÔNG BỐ ĐÁP ÁN)`,
    html: `
      <div class="s-kicker sec-ans">🎯 ĐÁP ÁN CHÍNH XÁC · BƯỚC 2/3 (CHỐT KẾT QUẢ)</div>
      <h2 class="s-title"><b>Câu ${q.id}:</b> ${q.desc}</h2>

      <div class="slido-layout">
        <div class="q-pane">
          ${q.svg ? `<div style="text-align:center; margin-bottom:12px; background:#fff; padding:8px; border-radius:10px; border:1px solid var(--line);">${q.svg}</div>` : ''}
          <div class="opts-grid ${q.opts.some(o => o.t.length > 35) ? 'single-col' : ''}">
            ${q.opts.map(o => `
              <div class="opt-box ${o.k === q.correct ? 'correct' : ''}">
                <div class="opt-label">${o.k} ${o.k === q.correct ? '✔' : ''}</div>
                <div class="opt-text"><b>${o.t}</b></div>
              </div>
            `).join('')}
          </div>

          <div class="ans-banner">
            <div class="ans-banner-title">
              <span style="background:#10B981; color:#fff; width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:22px;">✔</span>
              <span>PHƯƠNG ÁN ĐÚNG: <b>${q.correct}</b></span>
            </div>
            <div style="font-size:18px; font-weight:700; color:#B45309; font-family:var(--sans);">
              Bấm [→] để xem Lời giải chi tiết ➔
            </div>
          </div>
        </div>

        <div class="slido-pane">
          <div class="slido-head">
            <span class="live-pill" style="background:#E2E8F0; color:#475569;">
              🔒 ĐÃ CHỐT ĐÁP ÁN
            </span>
            <span class="slido-stat" id="slido-total-votes-ans">Kết quả khảo sát lớp</span>
          </div>

          <div class="slido-bars" id="slido-bars-ans">
            ${['A', 'B', 'C', 'D'].map(k => `
              <div class="bar-row ${k === q.correct ? 'highlight' : ''}" id="bar-row-ans-${k}">
                <div class="bar-meta">
                  <span>${k === q.correct ? '⭐ ' : ''}Phương án ${k} ${k === q.correct ? '(Đúng)' : ''}</span>
                  <span id="pct-ans-${k}">0% (0)</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill fill-${k}" id="fill-ans-${k}" style="width: 0%;"></div>
                </div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top:12px; background:#F8FAFC; padding:10px; border-radius:8px; font-size:15px; color:#475569; text-align:center; font-family:var(--sans);">
            Điện thoại học sinh đã tự động hiển thị kết quả chúc mừng và điểm số.
          </div>
        </div>
      </div>
    `
  });

  // SLIDE 3: LỜI GIẢI CHI TIẾT & KIẾN THỨC CỐT LÕI
  S.push({
    q_id: q.id,
    slide_type: 'solution',
    title: `Câu ${q.id} (Lời giải & Lý thuyết) - ${q.title}`,
    kicker: `CÂU ${q.id} / 12 · BƯỚC 3/3 (SƯ PHẠM & KIẾN THỨC)`,
    html: `
      <div class="s-kicker sec-sol">💡 HƯỚNG DẪN GIẢI CHI TIẾT & KIẾN THỨC LIÊN QUAN · BƯỚC 3/3</div>
      <h2 class="s-title" style="font-size:32px; margin-bottom:12px; color:#334155;"><b>Câu ${q.id}:</b> ${q.desc}</h2>

      <div class="sol-layout">
        <!-- Cột trái: Lời giải từng bước -->
        <div class="sol-box">
          <div class="box-title">
            <span>✔ Phương án đúng: <b>${q.correct}</b></span>
          </div>
          <div style="margin-bottom:16px;">${q.solution}</div>
          <div style="background:#FFFBEB; border-left:4px solid #F59E0B; padding:12px 14px; border-radius:8px; font-size:20px; color:#92400E;">
            <b>⚠️ Sai lầm thường gặp & Lưu ý:</b><br/>
            ${q.trap}
          </div>
        </div>

        <!-- Cột phải: Kiến thức trọng tâm -->
        <div class="theory-box">
          <div class="box-title">
            <span>📚 Kiến Thức Trọng Tâm SGK</span>
          </div>
          <div style="font-size:21px; line-height:1.65; color:#1E3A8A;">
            ${q.theory}
          </div>
          <div style="margin-top:20px; padding-top:12px; border-top:1px solid #BFDBFE; font-size:16px; color:#3B82F6; font-family:var(--sans);">
            ThS. Đinh Quốc Tuấn · Trung Tâm Bồi Dưỡng Văn Hóa HCMUS
          </div>
        </div>
      </div>

      <div style="margin-top:auto; padding-top:8px; text-align:right; font-size:18px; color:#64748B; font-style:italic; font-family:var(--sans);">
        Bấm <b>[→]</b> để chuyển sang Câu tiếp theo ➔
      </div>
    `
  });
});

// SLIDE TỔNG KẾT
S.push({
  title: "Tổng kết bài thi Toán 7",
  kicker: "Hoàn Thành Buổi Học",
  is_cover: true,
  html: `
    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; flex:1; text-align:center;">
      <div class="cover-logos" style="justify-content:center;">
        <img class="hcmus" src="${LOGO_HCMUS}" alt="HCMUS">
        <span class="sep"></span>
        <img class="sen" src="${LOGO_SEN}" alt="Logo sen">
      </div>
      <h1 class="cover-title" style="font-size:58px;">Chúc Mừng Các Em Đã Hoàn Thành!</h1>
      <p class="cover-sub" style="max-width:850px;">Toàn bộ 12 câu trắc nghiệm trọng tâm Cuối kì I Toán 7 đã được giải quyết trọn vẹn. Hãy xem lại lịch sử làm bài và các ghi chú sư phạm trên điện thoại.</p>
      <div style="display:flex; gap:18px; margin-top:20px;">
        <a href="slide-toan7.html" style="background:var(--luc); color:#fff; font-size:20px; font-weight:700; padding:12px 24px; border-radius:10px; text-decoration:none; font-family:var(--sans);">🔄 Trình chiếu lại từ đầu</a>
        <a href="giao-vien.html" style="background:var(--lam); color:#fff; font-size:20px; font-weight:700; padding:12px 24px; border-radius:10px; text-decoration:none; font-family:var(--sans);">🏠 Trở về Bảng Quản Lý</a>
      </div>
    </div>
  `
});

// BIẾN TOÀN CỤC & ENGINE
let cur = 0;
let isLocked = false;
let pollTimer = null;
const scaler = document.getElementById('scaler');

function fit() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const k = Math.min(w / 1600, h / 900);
  scaler.style.transform = `translate(-50%, -50%) scale(${k})`;
}

function slideHtml(s, i) {
  if (s.is_cover) {
    return `<section class="slide cover"><div class="s-body">${s.html}</div></section>`;
  }
  return `<section class="slide"><div class="s-body">${s.html}</div><div class="s-foot"><img class="hcmus" src="${LOGO_HCMUS}" alt="HCMUS"><span style="font-weight:600;">Lớp Toán 7 – ThS. Đinh Quốc Tuấn · Bồi Dưỡng Văn Hóa HCMUS</span><span class="grow"></span><span class="num">${i + 1} / ${S.length}</span><img class="sen" src="${LOGO_SEN}" alt="Sen"></div></section>`;
}

// XỬ LÝ MATHJAX AN TOÀN
let mathRunning = false;
let mathQueued = false;
function triggerMathJax() {
  if (!window.MathJax || !window.MathJax.typesetPromise) return;
  if (mathRunning) {
    mathQueued = true;
    return;
  }
  mathRunning = true;
  if (MathJax.typesetClear) {
    try { MathJax.typesetClear([scaler]); } catch(e) {}
  }
  MathJax.typesetPromise([scaler])
    .then(() => {
      mathRunning = false;
      if (mathQueued) {
        mathQueued = false;
        triggerMathJax();
      }
    })
    .catch(() => {
      mathRunning = false;
    });
}

// ĐỒNG BỘ TRẠNG THÁI SANG BACKEND
function syncStateToBackend(qId, slideType) {
  fetch(`slido-api.php?action=set_state&exam=toan7`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      current_q: qId,
      slide_type: slideType,
      is_locked: isLocked ? 1 : 0
    })
  }).catch(() => {});
}

// CẬP NHẬT KẾT QUẢ BÌNH CHỌN SLIDO REALTIME
function fetchSlidoResults(qId) {
  fetch(`slido-api.php?action=get_results&exam=toan7&q_id=${qId}&_t=${Date.now()}`)
    .then(r => r.json())
    .then(res => {
      if (res.status !== 'success') return;
      const total = res.total || 0;
      const pcts = res.percentages || {};
      const counts = res.counts || {};

      // Cập nhật giao diện Slide 1 (Đề & Slido)
      const totalEl = document.getElementById('slido-total-votes');
      if (totalEl) totalEl.innerText = `${total} bạn đã nộp`;

      ['A', 'B', 'C', 'D'].forEach(k => {
        const p = pcts[k] || 0;
        const c = counts[k] || 0;
        const fill = document.getElementById(`fill-${k}`);
        const pctEl = document.getElementById(`pct-${k}`);
        if (fill) fill.style.width = `${p}%`;
        if (pctEl) pctEl.innerText = `${p}% (${c})`;

        // Cập nhật giao diện Slide 2 (Đáp án)
        const fillAns = document.getElementById(`fill-ans-${k}`);
        const pctAnsEl = document.getElementById(`pct-ans-${k}`);
        if (fillAns) fillAns.style.width = `${p}%`;
        if (pctAnsEl) pctAnsEl.innerText = `${p}% (${c})`;
      });

      const totalAnsEl = document.getElementById('slido-total-votes-ans');
      if (totalAnsEl) totalAnsEl.innerText = `Tổng cộng: ${total} phiếu`;
    })
    .catch(() => {});
}

function startPolling(qId) {
  clearInterval(pollTimer);
  fetchSlidoResults(qId);
  pollTimer = setInterval(() => fetchSlidoResults(qId), 1500);
}

// HÀM CHUYỂN SLIDE CHỐNG LỖI DOM TEXTNODE
function go(i) {
  if (i < 0) i = 0;
  if (i >= S.length) i = S.length - 1;
  cur = i;

  scaler.innerHTML = slideHtml(S[i], i);

  // AN TOÀN: Dùng querySelector('.slide') thay vì firstChild (tránh TextNode crash)
  const slideEl = scaler.querySelector('.slide');
  if (slideEl) {
    slideEl.classList.add('enter');
  }

  // Cập nhật số slide trên thanh điều khiển
  const posEl = document.getElementById('pos');
  if (posEl) {
    posEl.innerText = `${i + 1} / ${S.length}`;
  }

  const progEl = document.getElementById('progress');
  if (progEl) {
    progEl.style.width = `${((i + 1) / S.length) * 100}%`;
  }

  const curSlide = S[i];
  if (curSlide && curSlide.q_id) {
    // Tự động mở bình chọn khi giáo viên qua câu mới
    if (curSlide.slide_type === 'question') {
      isLocked = false;
      const btn = document.getElementById('btnLock');
      if (btn) btn.innerHTML = '🔒 Khóa';
      const pill = document.getElementById('live-status-pill');
      if (pill) {
        pill.className = 'live-pill active';
        pill.innerHTML = '<span class="live-dot"></span> ĐANG BÌNH CHỌN';
      }
    }
    syncStateToBackend(curSlide.q_id, curSlide.slide_type);
    startPolling(curSlide.q_id);
  } else {
    clearInterval(pollTimer);
    syncStateToBackend(1, 'cover');
  }

  triggerMathJax();
}

function toggleLockVote() {
  isLocked = !isLocked;
  const btn = document.getElementById('btnLock');
  if (btn) btn.innerHTML = isLocked ? '🔓 Mở' : '🔒 Khóa';
  const pill = document.getElementById('live-status-pill');
  if (pill) {
    pill.className = isLocked ? 'live-pill' : 'live-pill active';
    pill.innerHTML = isLocked ? '🔒 ĐÃ KHÓA BÌNH CHỌN' : '<span class="live-dot"></span> ĐANG BÌNH CHỌN';
  }
  const curSlide = S[cur];
  if (curSlide && curSlide.q_id) {
    syncStateToBackend(curSlide.q_id, curSlide.slide_type);
  }
}

function resetCurrentVotes() {
  const curSlide = S[cur];
  if (!curSlide || !curSlide.q_id) return;
  if (confirm(`Xóa toàn bộ kết quả bình chọn của Câu ${curSlide.q_id}?`)) {
    fetch(`slido-api.php?action=reset_q&exam=toan7&q_id=${curSlide.q_id}`, { method: 'POST' })
      .then(() => fetchSlidoResults(curSlide.q_id));
  }
}

function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

function openModal(id) {
  document.getElementById(id).classList.add('on');
  if (id === 'mOverview') buildOverview();
}
function closeModals() {
  document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on'));
}

function buildOverview() {
  document.getElementById('ovList').innerHTML = S.map((s, idx) => `
    <button type="button" class="ov-btn ${idx === cur ? 'cur' : ''}" onclick="closeModals(); go(${idx});">
      <small>Slide ${idx + 1} · ${s.kicker || ''}</small>
      <b>${s.title}</b>
    </button>
  `).join('');
}

// Timer
let tLeft = 120, tRun = false, tInt = null;
function tShow() {
  const m = Math.floor(tLeft / 60);
  const s = tLeft % 60;
  document.getElementById('timerV').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function timerStart(min) {
  tLeft = min * 60;
  tRun = true;
  document.getElementById('timer').classList.add('on');
  tShow();
  clearInterval(tInt);
  tInt = setInterval(() => {
    if (!tRun) return;
    tLeft--;
    tShow();
    if (tLeft <= 0) {
      clearInterval(tInt);
      tRun = false;
      alert('Đã hết thời gian làm bài!');
    }
  }, 1000);
}
document.getElementById('timerP').onclick = function() {
  tRun = !tRun;
  this.innerText = tRun ? 'Tiếp tục' : 'Tạm dừng';
};
document.getElementById('timerX').onclick = function() {
  clearInterval(tInt);
  document.getElementById('timer').classList.remove('on');
};

// Hiện controls khi di chuột
let hideTimer = null;
function showControls() {
  document.body.classList.add('show-ctrl');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => document.body.classList.remove('show-ctrl'), 3000);
}
document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls, { passive: true });

// Phím tắt điều khiển thuận tiện cho giáo viên
document.addEventListener('keydown', (e) => {
  if (document.querySelector('.modal.on')) {
    if (e.key === 'Escape') closeModals();
    return;
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') {
    e.preventDefault();
    go(cur + 1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') {
    e.preventDefault();
    go(cur - 1);
  } else if (k === 'Home') {
    go(0);
  } else if (k === 'End') {
    go(S.length - 1);
  } else if (k === 'f' || k === 'F') {
    toggleFull();
  } else if (k === 'o' || k === 'O') {
    openModal('mOverview');
  } else if (k === 't' || k === 'T') {
    timerStart(2);
  } else if (k === 'l' || k === 'L') {
    toggleLockVote();
  } else if (k === '1' || k === '2' || k === '3') {
    if (cur > 0 && cur < S.length - 1) {
      const qIndex = Math.floor((cur - 1) / 3);
      const target = 1 + qIndex * 3 + (parseInt(k) - 1);
      if (target < S.length) go(target);
    }
  }
});

window.addEventListener('resize', fit);
window.addEventListener('DOMContentLoaded', () => {
  fit();
  go(0);
});
</script>
