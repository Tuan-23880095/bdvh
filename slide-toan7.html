<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toán 7 – Trình Chiếu Slido Tương Tác Trực Tiếp · ThS. Đinh Quốc Tuấn</title>
  <link rel="icon" type="image/svg+xml" href="https://diemdanhsv.com/images/logo-sen.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  
  <!-- MathJax 3 Cấu Hình An Toàn -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Stylesheet Slido Chuyên Biệt -->
  <link rel="stylesheet" href="assets/slido/slido-theme.css"/>
</head>
<body class="slido-teacher-body">

  <!-- SÂN KHẤU 16:9 CO GIÃN TỰ ĐỘNG -->
  <div id="stage">
    <div id="scaler">
      <!-- Slide được render động từ slido-teacher.js -->
    </div>
  </div>

  <!-- MINI CONTROL DOCK NỔI DƯỚI ĐÁY MÀN HÌNH -->
  <div id="mini-dock">
    <a href="index.html" class="dock-btn" title="Về trang chủ">
      🏠 Trang chủ
    </a>
    
    <button class="dock-btn" onclick="window.slidoTeacher.prev()" title="Slide trước (Phím ←)">
      ◄
    </button>
    <span class="dock-pos" id="dock-pos">1 / 38</span>
    <button class="dock-btn" onclick="window.slidoTeacher.next()" title="Slide tiếp (Phím → hoặc Space)">
      ►
    </button>

    <button class="dock-btn" id="dock-lock-btn" onclick="window.slidoTeacher.toggleLock()" title="Khóa/Mở bình chọn">
      🔒 Khóa
    </button>

    <button class="dock-btn" onclick="window.slidoTeacher.toggleFullscreen()" title="Toàn màn hình (F)">
      ⛶
    </button>

    <button class="dock-btn" onclick="window.slidoTeacher.toggleToc()" title="Mục lục (M)">
      📑 Mục lục
    </button>
  </div>

  <!-- DRAWER MỤC LỤC TRƯỢT TỪ BÊN PHẢI -->
  <div id="toc-drawer">
    <div class="toc-head">
      <h3 style="font-size:16px; font-weight:700;">Danh Sách Slide (38 trang)</h3>
      <button onclick="window.slidoTeacher.toggleToc(false)" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div class="toc-list" id="toc-list">
      <!-- Mục lục dựng tự động từ danh sách slide -->
    </div>
  </div>

  <!-- Nạp Thư viện QRCode và Mô-đun Trình Chiếu -->
  <script src="assets/qrcode.js"></script>
  <script src="assets/slido/toan7-data.js"></script>
  <script src="assets/slido/slido-teacher.js"></script>
</body>
</html>
